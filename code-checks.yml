name: Code checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python files
        run: python -m compileall -q app main.py
      - name: Run tests when present
        shell: bash
        run: |
          if [[ -d tests ]]; then
            pytest -q
          else
            echo "No tests/ directory yet; compilation check completed."
          fi
